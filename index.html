<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대구가톨릭대학교 시간표 최적화 도구</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap');
        
        :root {
            /* Chanel & Hermès inspired palette */
            --primary-black: #1a1a1a;
            --secondary-black: #2c2c2c;
            --accent-gold: #d4af37;
            --warm-gold: #f4e6c7;
            --cream: #faf8f3;
            --warm-grey: #8b8680;
            --dark-grey: #4a4a4a;
            --burgundy: #8b1538;
            --navy: #1e2a4a;
            --soft-white: #fefefe;
            --shadow: rgba(26, 26, 26, 0.15);
            --light-shadow: rgba(26, 26, 26, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--cream) 0%, var(--warm-gold) 100%);
            min-height: 100vh;
            color: var(--primary-black);
            line-height: 1.6;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: var(--soft-white);
            box-shadow: 0 0 60px var(--shadow);
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-black) 0%, var(--secondary-black) 100%);
            color: var(--soft-white);
            padding: 40px 60px;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, var(--accent-gold) 0%, transparent 70%);
            opacity: 0.1;
        }

        .header-content {
            position: relative;
            z-index: 2;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.2em;
            font-weight: 600;
            margin-bottom: 15px;
            letter-spacing: -0.02em;
            color: var(--soft-white);
        }

        .header .subtitle {
            font-size: 1.3em;
            opacity: 0.85;
            font-weight: 300;
            margin-bottom: 10px;
        }

        .header .tagline {
            font-size: 1em;
            color: var(--accent-gold);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 400px 1fr;
            min-height: calc(100vh - 200px);
        }

        .sidebar {
            background: var(--cream);
            border-right: 1px solid rgba(212, 175, 55, 0.2);
            padding: 40px 30px;
            overflow-y: auto;
        }

        .content-area {
            padding: 40px;
            overflow-y: auto;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5em;
            font-weight: 600;
            color: var(--primary-black);
            margin-bottom: 25px;
            position: relative;
            padding-bottom: 10px;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 50px;
            height: 2px;
            background: var(--accent-gold);
        }

        .search-section {
            margin-bottom: 30px;
        }

        .search-container {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 18px 50px 18px 20px;
            border: 2px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            font-size: 15px;
            font-weight: 400;
            background: var(--soft-white);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1);
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--warm-grey);
            font-size: 18px;
        }

        .filter-section {
            background: var(--soft-white);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 20px var(--light-shadow);
            margin-bottom: 25px;
        }

        .filter-group {
            margin-bottom: 20px;
        }

        .filter-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark-grey);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .filter-group select, .filter-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(139, 134, 128, 0.3);
            border-radius: 8px;
            font-size: 14px;
            background: var(--soft-white);
            transition: all 0.3s ease;
            outline: none;
        }

        .filter-group select:focus, .filter-group input:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }

        .btn {
            background: linear-gradient(135deg, var(--primary-black) 0%, var(--secondary-black) 100%);
            color: var(--soft-white);
            border: none;
            padding: 16px 32px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            margin-bottom: 12px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(26, 26, 26, 0.3);
        }

        .btn.secondary {
            background: linear-gradient(135deg, var(--burgundy) 0%, #a61e3c 100%);
        }

        .btn.tertiary {
            background: linear-gradient(135deg, var(--navy) 0%, #2a3a5a 100%);
        }

        .course-grid {
            display: grid;
            gap: 20px;
            max-height: 70vh;
            overflow-y: auto;
            padding-right: 10px;
        }

        .course-grid::-webkit-scrollbar {
            width: 6px;
        }

        .course-grid::-webkit-scrollbar-track {
            background: rgba(212, 175, 55, 0.1);
            border-radius: 3px;
        }

        .course-grid::-webkit-scrollbar-thumb {
            background: var(--accent-gold);
            border-radius: 3px;
        }

        .course-card {
            background: var(--soft-white);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            padding: 25px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .course-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--accent-gold);
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }

        .course-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 35px var(--light-shadow);
            border-color: var(--accent-gold);
        }

        .course-card:hover::before {
            transform: scaleY(1);
        }

        .course-card.selected {
            background: linear-gradient(135deg, var(--primary-black) 0%, var(--secondary-black) 100%);
            color: var(--soft-white);
            border-color: var(--accent-gold);
            box-shadow: 0 8px 30px rgba(26, 26, 26, 0.2);
        }

        .course-card.selected::before {
            background: var(--accent-gold);
            transform: scaleY(1);
        }

        .course-info h4 {
            font-family: 'Playfair Display', serif;
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 12px;
            color: inherit;
        }

        .course-info p {
            margin-bottom: 8px;
            font-size: 14px;
            opacity: 0.85;
        }

        .course-info .highlight {
            color: var(--accent-gold);
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 60px 40px;
            color: var(--warm-grey);
            font-size: 1.1em;
        }

        .schedule-container {
            background: var(--soft-white);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 30px var(--light-shadow);
            margin-top: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--cream) 0%, var(--warm-gold) 100%);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(212, 175, 55, 0.2);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--light-shadow);
        }

        .stat-card h5 {
            font-size: 13px;
            font-weight: 600;
            color: var(--dark-grey);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .stat-card .value {
            font-family: 'Playfair Display', serif;
            font-size: 2.2em;
            font-weight: 700;
            color: var(--primary-black);
        }

        .schedule-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px var(--light-shadow);
            margin: 20px 0;
        }

        .schedule-table th {
            background: linear-gradient(135deg, var(--primary-black) 0%, var(--secondary-black) 100%);
            color: var(--soft-white);
            padding: 15px 10px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .schedule-table td {
            border: 1px solid rgba(212, 175, 55, 0.15);
            padding: 8px;
            text-align: center;
            vertical-align: middle;
            height: 50px;
            background: var(--soft-white);
            transition: all 0.3s ease;
        }

        .schedule-table .time-slot {
            background: var(--cream);
            font-weight: 600;
            color: var(--dark-grey);
            min-width: 110px;
            font-size: 13px;
        }

        .schedule-table .course-slot {
            background: linear-gradient(135deg, var(--burgundy) 0%, #a61e3c 100%);
            color: var(--soft-white);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .schedule-table .course-slot:hover {
            background: linear-gradient(135deg, var(--navy) 0%, #2a3a5a 100%);
            transform: scale(1.02);
        }

        .selected-courses {
            margin-top: 30px;
            padding: 25px;
            background: var(--cream);
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .selected-course-item {
            background: var(--soft-white);
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 10px var(--light-shadow);
            transition: all 0.3s ease;
        }

        .selected-course-item:hover {
            transform: translateX(5px);
        }

        .remove-btn {
            background: var(--burgundy);
            color: var(--soft-white);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.3s ease;
        }

        .remove-btn:hover {
            background: #a61e3c;
            transform: translateY(-1px);
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--primary-black);
            color: var(--soft-white);
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 8px 25px var(--shadow);
            z-index: 1000;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }

        .notification.show {
            transform: translateX(0);
        }

        .tabs {
            display: flex;
            background: var(--cream);
            border-radius: 10px;
            padding: 5px;
            margin-bottom: 25px;
        }

        .tab {
            flex: 1;
            padding: 12px 20px;
            text-align: center;
            background: transparent;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            color: var(--dark-grey);
            transition: all 0.3s ease;
        }

        .tab.active {
            background: var(--soft-white);
            color: var(--primary-black);
            box-shadow: 0 2px 10px var(--light-shadow);
        }

        .advanced-filters {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: rgba(212, 175, 55, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .advanced-filters.show {
            display: block;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent-gold);
        }

        .export-section {
            margin-top: 20px;
            padding: 20px;
            background: var(--soft-white);
            border-radius: 10px;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .export-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .export-btn {
            padding: 10px 15px;
            font-size: 12px;
            background: var(--warm-grey);
            color: var(--soft-white);
        }

        @media (max-width: 1200px) {
            .main-layout {
                grid-template-columns: 350px 1fr;
            }
        }

        @media (max-width: 768px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
            
            .sidebar {
                border-right: none;
                border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            }
            
            .header {
                padding: 30px 20px;
            }
            
            .header h1 {
                font-size: 2.2em;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1>시간표 최적화 도구</h1>
                <p class="subtitle">2025학년도 2학기 대구가톨릭대학교</p>
                <p class="tagline">Elegant Schedule Planning</p>
            </div>
        </header>

        <div class="main-layout">
            <aside class="sidebar">
                <section class="search-section">
                    <h3 class="section-title">검색</h3>
                    <div class="search-container">
                        <input type="text" id="searchInput" class="search-input" placeholder="과목명, 교수명 검색...">
                        <span class="search-icon">🔍</span>
                    </div>
                </section>

                <section class="filter-section">
                    <h3 class="section-title">필터</h3>
                    
                    <div class="tabs">
                        <button class="tab active" onclick="switchTab('basic')">기본</button>
                        <button class="tab" onclick="switchTab('advanced')">고급</button>
                    </div>

                    <div id="basicFilters">
                        <div class="filter-group">
                            <label for="departmentFilter">개설학과</label>
                            <select id="departmentFilter">
                                <option value="">전체</option>
                            </select>
                        </div>

                        <div class="filter-group">
                            <label for="gradeFilter">학년</label>
                            <select id="gradeFilter">
                                <option value="">전체</option>
                                <option value="1">1학년</option>
                                <option value="2">2학년</option>
                                <option value="3">3학년</option>
                                <option value="4">4학년</option>
                            </select>
                        </div>

                        <div class="filter-group">
                            <label for="typeFilter">교과구분</label>
                            <select id="typeFilter">
                                <option value="">전체</option>
                                <option value="교선">교양선택</option>
                                <option value="교필">교양필수</option>
                                <option value="전선">전공선택</option>
                                <option value="전필">전공필수</option>
                            </select>
                        </div>

                        <div class="filter-group">
                            <label for="creditsFilter">학점</label>
                            <select id="creditsFilter">
                                <option value="">전체</option>
                                <option value="1">1학점</option>
                                <option value="2">2학점</option>
                                <option value="3">3학점</option>
                                <option value="4">4학점</option>
                                <option value="5">5학점</option>
                                <option value="6">6학점</option>
                            </select>
                        </div>
                    </div>

                    <div id="advancedFilters" class="advanced-filters">
                        <div class="filter-group">
                            <label>시간대 선택</label>
                            <div class="checkbox-group">
                                <div class="checkbox-item">
                                    <input type="checkbox" id="morning" value="morning">
                                    <label for="morning">오전 (9-12시)</label>
                                </div>
                                <div class="checkbox-item">
                                    <input type="checkbox" id="afternoon" value="afternoon">
                                    <label for="afternoon">오후 (13-17시)</label>
                                </div>
                                <div class="checkbox-item">
                                    <input type="checkbox" id="evening" value="evening">
                                    <label for="evening">저녁 (18-21시)</label>
                                </div>
                            </div>
                        </div>

                        <div class="filter-group">
                            <label>요일 선택</label>
                            <div class="checkbox-group">
                                <div class="checkbox-item">
                                    <input type="checkbox" id="weekdays" value="weekdays" checked>
                                    <label for="weekdays">평일</label>
                                </div>
                                <div class="checkbox-item">
                                    <input type="checkbox" id="saturday" value="saturday">
                                    <label for="saturday">토요일</label>
                                </div>
                            </div>
                        </div>

                        <div class="filter-group">
                            <label for="maxCredits">최대 학점</label>
                            <input type="number" id="maxCredits" min="1" max="25" placeholder="예: 18">
                        </div>
                    </div>

                    <button class="btn" onclick="applyFilters()">필터 적용</button>
                    <button class="btn secondary" onclick="optimizeSchedule()">시간표 최적화</button>
                    <button class="btn tertiary" onclick="generateRecommendations()">추천 시간표</button>
                </section>

                <section class="export-section">
                    <h4 class="section-title">내보내기</h4>
                    <div class="export-buttons">
                        <button class="btn export-btn" onclick="exportToPDF()">PDF</button>
                        <button class="btn export-btn" onclick="exportToExcel()">Excel</button>
                        <button class="btn export-btn" onclick="exportToImage()">이미지</button>
                        <button class="btn export-btn" onclick="shareSchedule()">공유</button>
                    </div>
                </section>
            </aside>

            <main class="content-area">
                <section class="results-section">
                    <h3 class="section-title">강의 목록</h3>
                    <div id="loadingIndicator" class="loading">
                        강의 데이터를 불러오는 중... ⏳
                    </div>
                    <div id="courseGrid" class="course-grid" style="display: none;"></div>
                </section>

                <section class="schedule-container">
                    <h3 class="section-title">시간표</h3>
                    
                    <div class="stats-grid">
                        <div class="stat-card">
                            <h5>선택 과목</h5>
                            <div class="value" id="selectedCount">0</div>
                        </div>
                        <div class="stat-card">
                            <h5>총 학점</h5>
                            <div class="value" id="totalCredits">0</div>
                        </div>
                        <div class="stat-card">
                            <h5>시간 충돌</h5>
                            <div class="value" id="conflicts">0</div>
                        </div>
                        <div class="stat-card">
                            <h5>공강시간</h5>
                            <div class="value" id="freeTime">0</div>
                        </div>
                    </div>
                    
                    <table class="schedule-table">
                        <thead>
                            <tr>
                                <th>시간</th>
                                <th>월</th>
                                <th>화</th>
                                <th>수</th>
                                <th>목</th>
                                <th>금</th>
                                <th>토</th>
                            </tr>
                        </thead>
                        <tbody id="scheduleTableBody">
                        </tbody>
                    </table>

                    <div class="selected-courses">
                        <h4 class="section-title">선택한 강의</h4>
                        <div id="selectedCoursesList"></div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script>
        let allCourses = [];
        let filteredCourses = [];
        let selectedCourses = [];
        let scheduleHistory = [];
        let currentTab = 'basic';

        // 알림 표시
        function showNotification(message, duration = 3000) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, duration);
        }

        // 탭 전환
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`[onclick="switchTab('${tab}')"]`).classList.add('active');
            
            if (tab === 'advanced') {
                document.getElementById('advancedFilters').classList.add('show');
            } else {
                document.getElementById('advancedFilters').classList.remove('show');
            }
        }

        function initializeSchedule() {

        // 강의 데이터 로드 (수정된 버전)
        async function loadCourseData() {
            try {
                showNotification('강의 데이터를 불러오는 중입니다...');
                
                const response = await window.fs.readFile('2025학년도 2학기 개설교과목 정보.xlsx');
                
                const workbook = XLSX.read(response, {
                    cellStyles: true,
                    cellFormulas: true,
                    cellDates: true,
                    cellNF: true,
                    sheetStubs: true
                });

                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                
                // 헤더는 3번째 행 (인덱스 2)
                const headers = jsonData[2];
                
                // 데이터 파싱
                allCourses = [];
                for (let i = 3; i < jsonData.length; i++) {
                    const row = jsonData[i];
                    if (row && row.length > 0 && row[0]) {
                        const course = {};
                        headers.forEach((header, index) => {
                            if (header) {
                                course[header.replace(/\r?\n/g, ' ')] = row[index] || '';
                            }
                        });
                        
                        // 시간 정보 파싱
                        course.parsedTime = parseTimeInfo(course['개설시간 및 강의실']);
                        course.id = course['과목-분반'];
                        allCourses.push(course);
                    }
                }
                
                filteredCourses = [...allCourses];
                populateFilters();
                displayCourses();
                
                document.getElementById('loadingIndicator').style.display = 'none';
                document.getElementById('courseGrid').style.display = 'block';
                
                showNotification(`${allCourses.length}개의 강의가 로드되었습니다!`);
                
            } catch (error) {
                console.error('데이터 로드 중 오류:', error);
                document.getElementById('loadingIndicator').innerHTML = `
                    <div style="color: var(--burgundy);">
                        ❌ 데이터 로드 중 오류가 발생했습니다.<br>
                        파일이 올바른지 확인해주세요.
                    </div>
                `;
                showNotification('데이터 로드에 실패했습니다.');
            }
        }

        // 시간 정보 파싱 (개선된 버전)
        function parseTimeInfo(timeString) {
            if (!timeString) return null;
            
            // 다양한 시간 형식 지원
            const patterns = [
                /([월화수목금토])(\d+[A-Z]?)-(\d+[A-Z]?)\((\d{2}:\d{2})-(\d{2}:\d{2})\)/g,
                /([월화수목금토])(\d+)-(\d+)\((\d{2}:\d{2})-(\d{2}:\d{2})\)/g,
                /([월화수목금토])\s*(\d+)\s*-\s*(\d+)\s*\((\d{2}:\d{2})-(\d{2}:\d{2})\)/g
            ];
            
            const matches = [];
            
            for (const pattern of patterns) {
                let match;
                while ((match = pattern.exec(timeString)) !== null) {
                    matches.push({
                        day: match[1],
                        startPeriod: match[2],
                        endPeriod: match[3],
                        startTime: match[4],
                        endTime: match[5],
                        timeSlot: `${match[4]}-${match[5]}`
                    });
                }
            }
            
            return matches.length > 0 ? matches : null;
        }

        // 필터 옵션 생성
        function populateFilters() {
            const departments = [...new Set(allCourses.map(c => c['개설학과(전공)']).filter(d => d))].sort();
            const deptSelect = document.getElementById('departmentFilter');
            
            departments.forEach(dept => {
                const option = document.createElement('option');
                option.value = dept;
                option.textContent = dept;
                deptSelect.appendChild(option);
            });
        }

        // 고급 필터 적용
        function applyAdvancedFilters(courses) {
            if (currentTab !== 'advanced') return courses;
            
            const timePreferences = {
                morning: document.getElementById('morning').checked,
                afternoon: document.getElementById('afternoon').checked,
                evening: document.getElementById('evening').checked
            };
            
            const dayPreferences = {
                weekdays: document.getElementById('weekdays').checked,
                saturday: document.getElementById('saturday').checked
            };
            
            const maxCredits = parseInt(document.getElementById('maxCredits').value) || Infinity;
            
            return courses.filter(course => {
                // 시간대 필터
                if (course.parsedTime && (timePreferences.morning || timePreferences.afternoon || timePreferences.evening)) {
                    const matchesTime = course.parsedTime.some(time => {
                        const hour = parseInt(time.startTime.split(':')[0]);
                        return (
                            (timePreferences.morning && hour >= 9 && hour < 12) ||
                            (timePreferences.afternoon && hour >= 13 && hour < 17) ||
                            (timePreferences.evening && hour >= 18 && hour <= 21)
                        );
                    });
                    if (!matchesTime) return false;
                }
                
                // 요일 필터
                if (course.parsedTime && (!dayPreferences.weekdays && !dayPreferences.saturday)) {
                    return false;
                }
                
                if (course.parsedTime && !dayPreferences.saturday) {
                    const hasSaturday = course.parsedTime.some(time => time.day === '토');
                    if (hasSaturday) return false;
                }
                
                // 학점 제한
                const credits = parseInt(course['학점'] || 0);
                if (credits > maxCredits) return false;
                
                return true;
            });
        }

        // 필터 적용
        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const department = document.getElementById('departmentFilter').value;
            const grade = document.getElementById('gradeFilter').value;
            const type = document.getElementById('typeFilter').value;
            const credits = document.getElementById('creditsFilter').value;

            filteredCourses = allCourses.filter(course => {
                const matchesSearch = !searchTerm || 
                    course['과 목 명'].toLowerCase().includes(searchTerm) ||
                    course['교수명'].toLowerCase().includes(searchTerm) ||
                    course['과목-분반'].toLowerCase().includes(searchTerm);
                
                const matchesDepartment = !department || course['개설학과(전공)'] === department;
                const matchesGrade = !grade || course['개설학년'].toString() === grade;
                const matchesType = !type || course['교과구분'] === type;
                const matchesCredits = !credits || course['학점'].toString() === credits;

                return matchesSearch && matchesDepartment && matchesGrade && matchesType && matchesCredits;
            });

            // 고급 필터 적용
            filteredCourses = applyAdvancedFilters(filteredCourses);

            displayCourses();
            showNotification(`${filteredCourses.length}개의 강의가 검색되었습니다.`);
        }

        // 강의 목록 표시
        function displayCourses() {
            const courseGrid = document.getElementById('courseGrid');
            courseGrid.innerHTML = '';

            if (filteredCourses.length === 0) {
                courseGrid.innerHTML = '<div class="loading">검색 결과가 없습니다. 다른 조건으로 검색해보세요.</div>';
                return;
            }

            const displayCount = Math.min(100, filteredCourses.length); // 성능을 위해 100개씩 제한
            
            for (let i = 0; i < displayCount; i++) {
                const course = filteredCourses[i];
                const courseCard = document.createElement('div');
                courseCard.className = 'course-card';
                courseCard.onclick = () => toggleCourse(course);
                
                if (selectedCourses.some(sc => sc.id === course.id)) {
                    courseCard.classList.add('selected');
                }

                const timeDisplay = course['개설시간 및 강의실'] || '시간 미정';
                const roomMatch = timeDisplay.match(/\(([^)]+)\)$/);
                const room = roomMatch ? roomMatch[1] : '';
                const timeOnly = timeDisplay.replace(/\([^)]+\)$/, '');

                courseCard.innerHTML = `
                    <div class="course-info">
                        <h4>${course['과 목 명']}</h4>
                        <p><span class="highlight">교수:</span> ${course['교수명']}</p>
                        <p><span class="highlight">학점:</span> ${course['학점']}학점 | <span class="highlight">구분:</span> ${course['교과구분']}</p>
                        <p><span class="highlight">시간:</span> ${timeOnly}</p>
                        <p><span class="highlight">강의실:</span> ${room}</p>
                        <p><span class="highlight">정원:</span> ${course['정원']}명 | <span class="highlight">과목코드:</span> ${course['과목-분반']}</p>
                    </div>
                `;
                
                courseGrid.appendChild(courseCard);
            }
            
            if (filteredCourses.length > displayCount) {
                const moreDiv = document.createElement('div');
                moreDiv.className = 'loading';
                moreDiv.innerHTML = `더 많은 결과가 있습니다. (${filteredCourses.length - displayCount}개 더)`;
                courseGrid.appendChild(moreDiv);

        }

        // 강의 선택/취소
        function toggleCourse(course) {
            const index = selectedCourses.findIndex(sc => sc.id === course.id);
            
            if (index === -1) {
                // 시간 충돌 검사
                if (hasTimeConflict(course)) {
                    if (!confirm('선택한 강의와 시간이 겹칩니다. 그래도 추가하시겠습니까?')) {
                        return;
                    }
                }
                
                selectedCourses.push(course);
                scheduleHistory.push({action: 'add', course: course, timestamp: Date.now()});
                showNotification(`"${course['과 목 명']}" 강의가 추가되었습니다.`);
            } else {
                selectedCourses.splice(index, 1);
                scheduleHistory.push({action: 'remove', course: course, timestamp: Date.now()});
                showNotification(`"${course['과 목 명']}" 강의가 제거되었습니다.`);
            }
            
            updateScheduleDisplay();
            updateStats();
            displayCourses();
            displaySelectedCourses();
        }

        // 시간 충돌 검사 (개별 강의)
        function hasTimeConflict(newCourse) {
            if (!newCourse.parsedTime) return false;
            
            return selectedCourses.some(existingCourse => {
                if (!existingCourse.parsedTime) return false;
                
                return newCourse.parsedTime.some(newTime => {
                    return existingCourse.parsedTime.some(existingTime => {
                        if (newTime.day !== existingTime.day) return false;
                        
                        const newStart = timeToMinutes(newTime.startTime);
                        const newEnd = timeToMinutes(newTime.endTime);
                        const existingStart = timeToMinutes(existingTime.startTime);
                        const existingEnd = timeToMinutes(existingTime.endTime);
                        
                        return (newStart < existingEnd && newEnd > existingStart);
                    });
                });
            });
        }

        // 시간을 분으로 변환
        function timeToMinutes(timeString) {
            const [hours, minutes] = timeString.split(':').map(Number);
            return hours * 60 + minutes;
        }

        // 시간표 표시 업데이트
        function updateScheduleDisplay() {
            // 모든 셀 초기화
            const cells = document.querySelectorAll('.schedule-table td:not(.time-slot)');
            cells.forEach(cell => {
                cell.innerHTML = '';
                cell.className = 'empty-slot';
            });

            // 선택된 강의 표시
            selectedCourses.forEach(course => {
                if (course.parsedTime) {
                    course.parsedTime.forEach(timeSlot => {
                        const startHour = parseInt(timeSlot.startTime.split(':')[0]);
                        const endHour = parseInt(timeSlot.endTime.split(':')[0]);
                        
                        for (let hour = startHour; hour < endHour; hour++) {
                            const cellId = `${timeSlot.day}-${hour.toString().padStart(2, '0')}:00-${(hour + 1).toString().padStart(2, '0')}:00`;
                            const cell = document.getElementById(cellId);
                            
                            if (cell) {
                                cell.innerHTML = `
                                    <div style="font-size: 10px; line-height: 1.2;">
                                        <strong>${course['과 목 명']}</strong><br>
                                        ${course['교수명']}
                                    </div>
                                `;
                                cell.className = 'course-slot';
                                cell.onclick = () => removeCourse(course.id);
                            }
                        }
                    });
                }
            });
        }

        // 통계 업데이트
        function updateStats() {
            document.getElementById('selectedCount').textContent = selectedCourses.length;
            
            const totalCredits = selectedCourses.reduce((sum, course) => {
                return sum + parseInt(course['학점'] || 0);
            }, 0);
            document.getElementById('totalCredits').textContent = totalCredits;
            
            // 시간 충돌 검사
            const conflicts = checkTimeConflicts();
            document.getElementById('conflicts').textContent = conflicts;
            
            // 공강시간 계산
            const freeTime = calculateFreeTime();
            document.getElementById('freeTime').textContent = freeTime;
        }

        // 시간 충돌 검사 (전체)
        function checkTimeConflicts() {
            const timeSlots = {};
            let conflicts = 0;
            
            selectedCourses.forEach(course => {
                if (course.parsedTime) {
                    course.parsedTime.forEach(timeSlot => {
                        const startHour = parseInt(timeSlot.startTime.split(':')[0]);
                        const endHour = parseInt(timeSlot.endTime.split(':')[0]);
                        
                        for (let hour = startHour; hour < endHour; hour++) {
                            const key = `${timeSlot.day}-${hour}`;
                            if (timeSlots[key]) {
                                conflicts++;
                            } else {
                                timeSlots[key] = course;
                            }
                        }
                    });
                }
            });
            
            return conflicts;
        }

        // 공강시간 계산
        function calculateFreeTime() {
            const occupiedSlots = new Set();
            
            selectedCourses.forEach(course => {
                if (course.parsedTime) {
                    course.parsedTime.forEach(timeSlot => {
                        const startHour = parseInt(timeSlot.startTime.split(':')[0]);
                        const endHour = parseInt(timeSlot.endTime.split(':')[0]);
                        
                        for (let hour = startHour; hour < endHour; hour++) {
                            occupiedSlots.add(`${timeSlot.day}-${hour}`);
                        }
                    });
                }
            });
            
            const totalSlots = 6 * 12; // 6일 * 12시간
            return totalSlots - occupiedSlots.size;
        }

        // 선택된 강의 목록 표시
        function displaySelectedCourses() {
            const selectedList = document.getElementById('selectedCoursesList');
            selectedList.innerHTML = '';
            
            if (selectedCourses.length === 0) {
                selectedList.innerHTML = '<div style="text-align: center; color: var(--warm-grey); padding: 40px;">선택된 강의가 없습니다.</div>';
                return;
            }
            
            selectedCourses.forEach(course => {
                const courseItem = document.createElement('div');
                courseItem.className = 'selected-course-item';
                
                const timeDisplay = course['개설시간 및 강의실'] || '시간 미정';
                
                courseItem.innerHTML = `
                    <div>
                        <strong style="font-size: 1.1em;">${course['과 목 명']}</strong> 
                        <span style="color: var(--accent-gold); font-weight: 600;">(${course['학점']}학점)</span><br>
                        <small style="color: var(--warm-grey);">
                            ${course['교수명']} | ${timeDisplay}
                        </small>
                    </div>
                    <button class="remove-btn" onclick="removeCourse('${course.id}')">삭제</button>
                `;
                selectedList.appendChild(courseItem);
            });
        }

        // 강의 삭제
        function removeCourse(courseId) {
            const course = selectedCourses.find(c => c.id === courseId);
            if (course) {
                selectedCourses = selectedCourses.filter(c => c.id !== courseId);
                scheduleHistory.push({action: 'remove', course: course, timestamp: Date.now()});
                updateScheduleDisplay();
                updateStats();
                displayCourses();
                displaySelectedCourses();
                showNotification(`"${course['과 목 명']}" 강의가 제거되었습니다.`);
            }
        }

        // 시간표 최적화
        function optimizeSchedule() {
            if (selectedCourses.length === 0) {
                showNotification('먼저 강의를 선택해주세요.');
                return;
            }
            
            const conflicts = checkTimeConflicts();
            if (conflicts > 0) {
                if (confirm(`${conflicts}개의 시간 충돌이 발견되었습니다. 충돌하는 강의를 자동으로 제거하시겠습니까?`)) {
                    resolveConflicts();
                }
            }
            
            suggestOptimizations();
        }

        // 충돌 해결
        function resolveConflicts() {
            const conflicts = [];
            const timeSlots = {};
            
            selectedCourses.forEach((course, courseIndex) => {
                if (course.parsedTime) {
                    course.parsedTime.forEach(timeSlot => {
                        const startHour = parseInt(timeSlot.startTime.split(':')[0]);
                        const endHour = parseInt(timeSlot.endTime.split(':')[0]);
                        
                        for (let hour = startHour; hour < endHour; hour++) {
                            const key = `${timeSlot.day}-${hour}`;
                            if (timeSlots[key]) {
                                conflicts.push({
                                    existing: timeSlots[key],
                                    conflicting: courseIndex
                                });
                            } else {
                                timeSlots[key] = courseIndex;
                            }
                        }
                    });
                }
            });
            
            // 충돌하는 강의 중 나중에 추가된 것들 제거
            const toRemove = [...new Set(conflicts.map(c => c.conflicting))].sort((a, b) => b - a);
            const removedCourses = [];
            
            toRemove.forEach(index => {
                removedCourses.push(selectedCourses[index]['과 목 명']);
                selectedCourses.splice(index, 1);
            });
            
            updateScheduleDisplay();
            updateStats();
            displayCourses();
            displaySelectedCourses();
            
            if (removedCourses.length > 0) {
                showNotification(`충돌 해결 완료: ${removedCourses.join(', ')} 강의가 제거되었습니다.`);
            }
        }

        // 최적화 제안
        function suggestOptimizations() {
            const suggestions = [];
            
            // 점심시간 확보 체크
            const lunchConflict = selectedCourses.some(course => {
                if (!course.parsedTime) return false;
                return course.parsedTime.some(time => {
                    const start = timeToMinutes(time.startTime);
                    const end = timeToMinutes(time.endTime);
                    return (start <= 720 && end >= 780); // 12:00-13:00
                });
            });
            
            if (lunchConflict) {
                suggestions.push('🍽️ 점심시간(12:00-13:00)에 강의가 있습니다.');
            }
            
            // 하루 최대 강의시간 체크
            const dailyHours = {};
            selectedCourses.forEach(course => {
                if (course.parsedTime) {
                    course.parsedTime.forEach(time => {
                        const duration = (timeToMinutes(time.endTime) - timeToMinutes(time.startTime)) / 60;
                        dailyHours[time.day] = (dailyHours[time.day] || 0) + duration;
                    });
                }
            });
            
            Object.entries(dailyHours).forEach(([day, hours]) => {
                if (hours > 6) {
                    suggestions.push(`📚 ${day}요일에 ${hours}시간의 강의가 있어 부담이 클 수 있습니다.`);
                }
            });
            
            // 연속 강의 체크
            const consecutiveClasses = checkConsecutiveClasses();
            if (consecutiveClasses.length > 0) {
                suggestions.push(`⏰ 연속 강의: ${consecutiveClasses.join(', ')}`);
            }
            
            // 공강일 체크
            const occupiedDays = [...new Set(selectedCourses.flatMap(course => 
                course.parsedTime ? course.parsedTime.map(t => t.day) : []
            ))];
            
            const freeDays = ['월', '화', '수', '목', '금'].filter(day => !occupiedDays.includes(day));
            if (freeDays.length > 0) {
                suggestions.push(`🎉 공강일: ${freeDays.join(', ')}요일`);
            }
            
            // 총 학점 체크
            const totalCredits = selectedCourses.reduce((sum, course) => sum + parseInt(course['학점'] || 0), 0);
            if (totalCredits < 12) {
                suggestions.push('⚠️ 총 학점이 12학점 미만입니다. 최소 이수 학점을 확인해주세요.');
            } else if (totalCredits > 21) {
                suggestions.push('⚠️ 총 학점이 21학점을 초과합니다. 학습 부담을 고려해주세요.');
            }
            
            const message = suggestions.length > 0 ? 
                '📊 시간표 분석 결과:\n\n' + suggestions.join('\n\n') : 
                '✅ 현재 시간표가 잘 최적화되어 있습니다!';
            
            alert(message);
        }

        // 연속 강의 체크
        function checkConsecutiveClasses() {
            const consecutive = [];
            const daySchedules = {};
            
            selectedCourses.forEach(course => {
                if (course.parsedTime) {
                    course.parsedTime.forEach(time => {
                        if (!daySchedules[time.day]) daySchedules[time.day] = [];
                        daySchedules[time.day].push({
                            course: course['과 목 명'],
                            start: timeToMinutes(time.startTime),
                            end: timeToMinutes(time.endTime)
                        });
                    });
                }
            });
            
            Object.entries(daySchedules).forEach(([day, classes]) => {
                classes.sort((a, b) => a.start - b.start);
                let consecutiveCount = 1;
                
                for (let i = 1; i < classes.length; i++) {
                    if (classes[i].start === classes[i-1].end) {
                        consecutiveCount++;
                    } else {
                        if (consecutiveCount >= 3) {
                            consecutive.push(`${day}요일 ${consecutiveCount}연강`);
                        }
                        consecutiveCount = 1;
                    }
                }
                
                if (consecutiveCount >= 3) {
                    consecutive.push(`${day}요일 ${consecutiveCount}연강`);
                }
            });
            
            return consecutive;
        }

        // 추천 시간표 생성
        function generateRecommendations() {
            if (allCourses.length === 0) {
                showNotification('강의 데이터를 먼저 로드해주세요.');
                return;
            }
            
            // 간단한 추천 알고리즘
            const recommendations = [];
            const preferences = {
                maxCredits: 18,
                preferMorning: false,
                avoidFriday: true,
                maxDailyHours: 6
            };
            
            // 사용자 선호도를 고려한 추천 로직
            const availableCourses = allCourses.filter(course => {
                return course.parsedTime && course.parsedTime.length > 0;
            });
            
            // 랜덤하게 시간표 조합 생성
            for (let i = 0; i < 3; i++) {
                const recommended = generateRandomSchedule(availableCourses, preferences);
                if (recommended.length > 0) {
                    recommendations.push(recommended);
                }
            }
            
            if (recommendations.length > 0) {
                displayRecommendations(recommendations);
            } else {
                showNotification('추천 시간표를 생성할 수 없습니다.');
            }
        }

        // 랜덤 시간표 생성
        function generateRandomSchedule(courses, preferences) {
            const schedule = [];
            const occupiedSlots = new Set();
            let totalCredits = 0;
            
            const shuffled = [...courses].sort(() => Math.random() - 0.5);
            
            for (const course of shuffled) {
                if (totalCredits >= preferences.maxCredits) break;
                
                const credits = parseInt(course['학점'] || 0);
                if (totalCredits + credits > preferences.maxCredits) continue;
                
                // 시간 충돌 체크
                let hasConflict = false;
                const courseSlots = [];
                
                if (course.parsedTime) {
                    for (const time of course.parsedTime) {
                        const startHour = parseInt(time.startTime.split(':')[0]);
                        const endHour = parseInt(time.endTime.split(':')[0]);
                        
                        for (let hour = startHour; hour < endHour; hour++) {
                            const slot = `${time.day}-${hour}`;
                            if (occupiedSlots.has(slot)) {
                                hasConflict = true;
                                break;
                            }
                            courseSlots.push(slot);
                        }
                        if (hasConflict) break;
                    }
                }
                
                if (!hasConflict && courseSlots.length > 0) {
                    schedule.push(course);
                    courseSlots.forEach(slot => occupiedSlots.add(slot));
                    totalCredits += credits;
                }
                
                if (schedule.length >= 7) break; // 최대 7과목
            }
            
            return schedule;
        }

        // 추천 시간표 표시
        function displayRecommendations(recommendations) {
            let message = '🎯 추천 시간표:\n\n';
            
            recommendations.forEach((schedule, index) => {
                const totalCredits = schedule.reduce((sum, course) => sum + parseInt(course['학점'] || 0), 0);
                message += `【추천 ${index + 1}】 (총 ${totalCredits}학점)\n`;
                
                schedule.forEach(course => {
                    message += `• ${course['과 목 명']} (${course['학점']}학점) - ${course['교수명']}\n`;
                });
                message += '\n';
            });
            
            if (confirm(message + '첫 번째 추천 시간표를 적용하시겠습니까?')) {
                selectedCourses = [...recommendations[0]];
                updateScheduleDisplay();
                updateStats();
                displayCourses();
                displaySelectedCourses();
                showNotification('추천 시간표가 적용되었습니다!');
            }
        }

        // 내보내기 기능들
        function exportToPDF() {
            showNotification('PDF 내보내기 기능은 준비 중입니다.');
        }

        function exportToExcel() {
            if (selectedCourses.length === 0) {
                showNotification('선택된 강의가 없습니다.');
                return;
            }
            
            const data = selectedCourses.map(course => ({
                '과목명': course['과 목 명'],
                '교수명': course['교수명'],
                '학점': course['학점'],
                '교과구분': course['교과구분'],
                '시간': course['개설시간 및 강의실'],
                '과목코드': course['과목-분반']
            }));
            
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "내 시간표");
            XLSX.writeFile(wb, "내_시간표.xlsx");
            showNotification('Excel 파일이 다운로드되었습니다.');
        }

        function exportToImage() {
            showNotification('이미지 내보내기 기능은 준비 중입니다.');
        }

        function shareSchedule() {
            if (selectedCourses.length === 0) {
                showNotification('선택된 강의가 없습니다.');
                return;
            }
            
            const scheduleText = selectedCourses.map(course => 
                `${course['과 목 명']} (${course['학점']}학점) - ${course['교수명']}`
            ).join('\n');
            
            const shareText = `📚 내 시간표 (총 ${selectedCourses.reduce((sum, c) => sum + parseInt(c['학점'] || 0), 0)}학점)\n\n${scheduleText}`;
            
            if (navigator.share) {
                navigator.share({
                    title: '내 시간표',
                    text: shareText
                });
            } else {
                navigator.clipboard.writeText(shareText).then(() => {
                    showNotification('시간표가 클립보드에 복사되었습니다.');
                });
            }
        }

        // 실행 취소 기능
        function undoLastAction() {
            if (scheduleHistory.length === 0) {
                showNotification('실행 취소할 작업이 없습니다.');
                return;
            }
            
            const lastAction = scheduleHistory.pop();
            if (lastAction.action === 'add') {
                selectedCourses = selectedCourses.filter(c => c.id !== lastAction.course.id);
            } else if (lastAction.action === 'remove') {
                selectedCourses.push(lastAction.course);
            }
            
            updateScheduleDisplay();
            updateStats();
            displayCourses();
            displaySelectedCourses();
            showNotification('작업이 취소되었습니다.');
        }

        // 시간표 저장/불러오기
        function saveSchedule() {
            if (selectedCourses.length === 0) {
                showNotification('저장할 강의가 없습니다.');
                return;
            }
            
            const scheduleData = {
                courses: selectedCourses,
                timestamp: Date.now(),
                totalCredits: selectedCourses.reduce((sum, c) => sum + parseInt(c['학점'] || 0), 0)
            };
            
            localStorage.setItem('saved_schedule', JSON.stringify(scheduleData));
            showNotification('시간표가 저장되었습니다.');
        }

        function loadSchedule() {
            const savedData = localStorage.getItem('saved_schedule');
            if (!savedData) {
                showNotification('저장된 시간표가 없습니다.');
                return;
            }
            
            try {
                const scheduleData = JSON.parse(savedData);
                selectedCourses = scheduleData.courses || [];
                
                updateScheduleDisplay();
                updateStats();
                displayCourses();
                displaySelectedCourses();
                showNotification('저장된 시간표를 불러왔습니다.');
            } catch (error) {
                showNotification('시간표 불러오기에 실패했습니다.');
            }
        }

        // 검색 이벤트 리스너
        document.getElementById('searchInput').addEventListener('input', function() {
            clearTimeout(this.searchTimeout);
            this.searchTimeout = setTimeout(applyFilters, 300);
        });

        // 필터 변경 이벤트 리스너
        ['departmentFilter', 'gradeFilter', 'typeFilter', 'creditsFilter'].forEach(filterId => {
            const element = document.getElementById(filterId);
            if (element) {
                element.addEventListener('change', applyFilters);
            }
        });

        // 고급 필터 이벤트 리스너
        ['morning', 'afternoon', 'evening', 'weekdays', 'saturday'].forEach(filterId => {
            const element = document.getElementById(filterId);
            if (element) {
                element.addEventListener('change', applyFilters);
            }
        });

        const maxCreditsElement = document.getElementById('maxCredits');
        if (maxCreditsElement) {
            maxCreditsElement.addEventListener('input', function() {
                clearTimeout(this.filterTimeout);
                this.filterTimeout = setTimeout(applyFilters, 500);
            });
        }

        // 키보드 단축키
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey || e.metaKey) {
                switch(e.key) {
                    case 'f':
                        e.preventDefault();
                        document.getElementById('searchInput').focus();
                        break;
                    case 'o':
                        e.preventDefault();
                        optimizeSchedule();
                        break;
                    case 's':
                        e.preventDefault();
                        saveSchedule();
                        break;
                    case 'l':
                        e.preventDefault();
                        loadSchedule();
                        break;
                    case 'z':
                        e.preventDefault();
                        undoLastAction();
                        break;
                    case 'r':
                        e.preventDefault();
                        generateRecommendations();
                        break;
                }
            }
            
            // ESC 키로 선택 초기화
            if (e.key === 'Escape') {
                if (selectedCourses.length > 0 && confirm('선택된 모든 강의를 초기화하시겠습니까?')) {
                    selectedCourses = [];
                    scheduleHistory = [];
                    updateScheduleDisplay();
                    updateStats();
                    displayCourses();
                    displaySelectedCourses();
                    showNotification('시간표가 초기화되었습니다.');
                }
            }
        });

        // 도움말 표시
        function showHelp() {
            const helpText = `
🎯 시간표 최적화 도구 사용법

📌 기본 기능:
• 강의 검색: 과목명, 교수명으로 검색
• 강의 선택: 강의 카드 클릭으로 선택/해제
• 시간표 보기: 실시간 시간표 업데이트

🔍 필터 기능:
• 기본 필터: 학과, 학년, 교과구분, 학점
• 고급 필터: 시간대, 요일, 최대학점 설정

⚡ 최적화 기능:
• 시간 충돌 자동 감지 및 해결
• 점심시간, 연강, 공강 분석
• 맞춤형 시간표 추천

⌨️ 단축키:
• Ctrl+F: 검색
• Ctrl+O: 최적화
• Ctrl+S: 저장
• Ctrl+L: 불러오기
• Ctrl+Z: 실행취소
• Ctrl+R: 추천시간표
• ESC: 초기화

💾 내보내기:
• Excel, PDF, 이미지 내보내기
• 시간표 공유 기능
            `;
            
            alert(helpText);
        }

        // 통계 애니메이션
        function animateStats() {
            const statValues = document.querySelectorAll('.stat-card .value');
            statValues.forEach(stat => {
                stat.style.transform = 'scale(1.1)';
                setTimeout(() => {
                    stat.style.transform = 'scale(1)';
                }, 200);
            });
        }

        // 페이지 로드 시 초기화
        document.addEventListener('DOMContentLoaded', function() {
            initializeSchedule();
            loadCourseData();
            
            // 도움말 버튼 추가
            const helpButton = document.createElement('button');
            helpButton.innerHTML = '❓ 도움말';
            helpButton.className = 'btn';
            helpButton.style.position = 'fixed';
            helpButton.style.bottom = '20px';
            helpButton.style.right = '20px';
            helpButton.style.width = 'auto';
            helpButton.style.padding = '10px 20px';
            helpButton.style.fontSize = '12px';
            helpButton.style.zIndex = '1000';
            helpButton.onclick = showHelp;
            document.body.appendChild(helpButton);
            
            // 자동 저장 기능
            setInterval(() => {
                if (selectedCourses.length > 0) {
                    const autoSaveData = {
                        courses: selectedCourses,
                        timestamp: Date.now(),
                        autoSave: true
                    };
                    localStorage.setItem('auto_save_schedule', JSON.stringify(autoSaveData));
                }
            }, 30000); // 30초마다 자동 저장
            
            // 자동 저장된 데이터 복구 확인
            const autoSaveData = localStorage.getItem('auto_save_schedule');
            if (autoSaveData) {
                try {
                    const data = JSON.parse(autoSaveData);
                    if (data.autoSave && Date.now() - data.timestamp < 24 * 60 * 60 * 1000) { // 24시간 이내
                        if (confirm('이전에 작업하던 시간표가 있습니다. 복구하시겠습니까?')) {
                            selectedCourses = data.courses || [];
                            updateScheduleDisplay();
                            updateStats();
                            displayCourses();
                            displaySelectedCourses();
                        }
                    }
                } catch (error) {
                    console.error('자동 저장 데이터 복구 실패:', error);
                }
            }
            
            // 환영 메시지
            setTimeout(() => {
                showNotification('시간표 최적화 도구에 오신 것을 환영합니다! 🎓', 5000);
            }, 1000);
        });

        // 반응형 처리
        function handleResize() {
            const isMobile = window.innerWidth <= 768;
            const courseGrid = document.getElementById('courseGrid');
            
            if (isMobile && courseGrid) {
                courseGrid.style.maxHeight = '50vh';
            } else if (courseGrid) {
                courseGrid.style.maxHeight = '70vh';
            }
        }

        window.addEventListener('resize', handleResize);
        
        // 페이지 가시성 변경 시 자동 저장
        document.addEventListener('visibilitychange', function() {
            if (document.hidden && selectedCourses.length > 0) {
                saveSchedule();
            }
        });

        // 서비스 워커 등록 (PWA 지원)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                // 서비스 워커 등록은 실제 배포 시에만 활성화
                console.log('PWA 지원 준비됨');
            });
        }
    </script>
</body>
